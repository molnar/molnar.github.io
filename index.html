<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOAA HAB Sentinel-3 Time Series (OpenLayers)</title>

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />

  <style>
    html, body, #map {
      height: 100%;
      width: 100vw;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.9);
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      z-index: 2000;
      display: none; 
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }

    /* Custom OpenLayers Control Styling */
    .custom-control {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: white;
      padding: 15px;
      width: 400px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      z-index: 1000;
    }

    #cogDateSlider {
      height: 6px;
      accent-color: #0078A8;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="loading">Loading GeoTIFF...</div>

  <!-- GeoTIFF.js (Required by OpenLayers for COG support) -->
  <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <!-- OpenLayers JS -->
  <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>

  <script>
    // 1. Initialize Map with OpenStreetMap Base Layer
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        })
      ],
      view: new ol.View({
        center: [0, 0],
        zoom: 3
      })
    });

    let currentCogLayer = null;
    let hasBoundsFitted = false;
    let currentRequestUrl = null;
    const loadingIndicator = document.getElementById('loading');

    // 2. Create Custom UI Control for the Slider
    const controlDiv = document.createElement('div');
    controlDiv.className = 'custom-control ol-unselectable';
    
    // Generate datalist for the 31 days
    let dataListHtml = '<datalist id="dateTicks">';
    for(let i = 1; i <= 31; i++) {
       dataListHtml += `<option value="${i}"></option>`;
    }
    dataListHtml += '</datalist>';

    controlDiv.innerHTML = `
      <label for="cogDateSlider" style="display:block; margin-bottom: 10px; font-weight: bold; font-size: 14px;">
        Date: <span id="dateDisplay" style="color: #0078A8;">July 1, 2026</span>
      </label>
      
      <input type="range" id="cogDateSlider" min="1" max="31" value="1" step="1" list="dateTicks" style="width: 100%; cursor: pointer;">
      ${dataListHtml}
      
      <div style="display: flex; justify-content: space-between; font-size: 11px; color: #666; margin-top: 5px; padding: 0 4px;">
        <span>1</span><span>5</span><span>10</span><span>15</span><span>20</span><span>25</span><span>31</span>
      </div>
    `;

    // Prevent map dragging/zooming when interacting with the slider
    controlDiv.addEventListener('pointerdown', (e) => e.stopPropagation());
    controlDiv.addEventListener('wheel', (e) => e.stopPropagation());

    // Add control to map
    const dateControl = new ol.control.Control({ element: controlDiv });
    map.addControl(dateControl);

    // 3. Function to load and swap the GeoTIFF
    function loadGeoTiffForDay(day) {
      if (currentCogLayer) {
        map.removeLayer(currentCogLayer);
        currentCogLayer = null;
      }

      const julianDay = 181 + day; 
      const formattedDay = day.toString().padStart(2, '0');

      const baseUrl = `https://nccospublicstor.blob.core.windows.net/hab-data/data/web/geotiff/sentinel-3.2026${julianDay}.07${formattedDay}.landwatercolor.tif`;
      const url = `${baseUrl}?t=${new Date().getTime()}`; // Cache-buster
      
      console.log(`Fetching: ${baseUrl}`); 
      loadingIndicator.style.display = 'block';
      currentRequestUrl = url; 

      // Native OpenLayers GeoTIFF Source
      const cogSource = new ol.source.GeoTIFF({
        sources: [{ url: url }]
      });

      // Native OpenLayers WebGL layer for rendering COGs
      const cogLayer = new ol.layer.WebGLTile({
        source: cogSource,
        opacity: 0.8
      });

      // Wait for the GeoTIFF metadata to load so we can get its bounding box
      cogSource.getView().then((viewConfig) => {
// Prevent race condition if user slides very fast
        if (currentRequestUrl !== url) return;

        currentCogLayer = cogLayer;
        map.addLayer(currentCogLayer);
        
        // Fit the map to the GeoTIFF's extent on the very first load
        if (!hasBoundsFitted && viewConfig.extent) {
          
          // --- FIX: Transform the extent from Degrees to Meters ---
          const mapProjection = map.getView().getProjection();
          const extentInMeters = ol.proj.transformExtent(
            viewConfig.extent, 
            viewConfig.projection, 
            mapProjection
          );

          // Use the newly transformed extent
          map.getView().fit(extentInMeters, { duration: 1000 });
          hasBoundsFitted = true;
        }

        loadingIndicator.style.display = 'none';
      }).catch(error => {
        if (currentRequestUrl === url) {
          console.error("Error loading GeoTIFF:", error);
          loadingIndicator.style.display = 'none';
          alert(`Failed to load data for July ${day}, 2026. File may be missing.`);
        }
      });
    }

    // 4. Attach event listeners to the slider
    const slider = document.getElementById('cogDateSlider');
    const display = document.getElementById('dateDisplay');

    slider.addEventListener('input', (event) => {
      display.innerText = `July ${event.target.value}, 2026`;
    });

    slider.addEventListener('change', (event) => {
      const day = parseInt(event.target.value, 10);
      loadGeoTiffForDay(day);
    });

    // Load initial date (July 1st)
    loadGeoTiffForDay(parseInt(slider.value, 10));

  </script>

</body>
</html>
